name: Update Mihomo Alpha ARM64 UPX

on:
  schedule:
    # 每天北京时间 04:30
    - cron: "30 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Get latest Mihomo Alpha version
        id: version
        shell: bash
        run: |
          set -e

          VERSION=$(curl -fsSL \
            https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/version.txt)

          VERSION=$(echo "$VERSION" | tr -d '\r\n')

          if [ -z "$VERSION" ]; then
            echo "获取版本失败"
            exit 1
          fi

          echo "最新 Alpha: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Mihomo ARM64
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/mihomo-linux-arm64-${VERSION}.gz"

          echo "下载：$URL"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o mihomo-original.gz

      - name: Extract Mihomo
        run: |
          set -e

          gzip -t mihomo-original.gz

          gzip -dc mihomo-original.gz > mihomo-linux-arm64

          chmod +x mihomo-linux-arm64

      - name: Show original size
        run: |
          echo "原始文件："
          ls -lh mihomo-linux-arm64

      - name: Compress with UPX
        run: |
          set -e

          upx --version

          upx --best --lzma mihomo-linux-arm64

      - name: Verify UPX
        run: |
          set -e

          echo "UPX 文件信息："
          upx -t mihomo-linux-arm64

          echo "压缩后："
          ls -lh mihomo-linux-arm64

          file mihomo-linux-arm64

      - name: Gzip UPX binary
        run: |
          set -e

          gzip -9 -c mihomo-linux-arm64 > mihomo-linux-arm64.gz

      - name: Save version
        run: |
          echo "${{ steps.version.outputs.version }}" > mihomo-version.txt

      - name: Commit update
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mihomo-linux-arm64
          git add mihomo-linux-arm64.gz
          git add mihomo-version.txt

          if git diff --cached --quiet; then
            echo "没有新版本"
            exit 0
          fi

          git commit -m "Update Mihomo Alpha ${{ steps.version.outputs.version }} UPX"
          git push
