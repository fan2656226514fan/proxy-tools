name: Update Mihomo Alpha ARM64

on:
  schedule:
    # 每天北京时间 04:30 执行
    # GitHub Actions 使用 UTC，所以这里是 20:30 UTC
    - cron: "30 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest Mihomo Alpha version
        id: version
        shell: bash
        run: |
          set -e

          VERSION=$(curl -fsSL \
            https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/version.txt)

          VERSION=$(echo "$VERSION" | tr -d '\r\n')

          if [ -z "$VERSION" ]; then
            echo "无法获取 Mihomo Alpha 版本"
            exit 1
          fi

          echo "最新 Alpha: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Mihomo ARM64 Alpha
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/mihomo-linux-arm64-${VERSION}.gz"

          echo "下载：$URL"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o mihomo-linux-arm64.gz

      - name: Verify and extract
        shell: bash
        run: |
          set -e

          gzip -t mihomo-linux-arm64.gz

          rm -f mihomo-linux-arm64

          gzip -dc mihomo-linux-arm64.gz > mihomo-linux-arm64

          chmod +x mihomo-linux-arm64

          echo "文件信息："
          file mihomo-linux-arm64

      - name: Create tar.gz
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          rm -f "mihomo-linux-arm64-${VERSION}.tar.gz"

          tar -czf "mihomo-linux-arm64-${VERSION}.tar.gz" \
            mihomo-linux-arm64

          echo "压缩包信息："
          tar -tzvf "mihomo-linux-arm64-${VERSION}.tar.gz"

      - name: Save version
        shell: bash
        run: |
          echo "${{ steps.version.outputs.version }}" > mihomo-version.txt

      - name: Commit latest Alpha
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "mihomo-linux-arm64-${{ steps.version.outputs.version }}.tar.gz" \
            mihomo-version.txt

          if git diff --cached --quiet; then
            echo "没有新版本，不提交"
            exit 0
          fi

          git commit -m "Update Mihomo Alpha ${{ steps.version.outputs.version }}"
          git push
