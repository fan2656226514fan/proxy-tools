```yaml
name: Update Mihomo Alpha ARM64 UPX

on:
  schedule:
    # 每天北京时间 04:30
    - cron: "30 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Get latest Mihomo Alpha version
        id: version
        shell: bash
        run: |
          set -e

          VERSION=$(curl -fsSL \
            https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/version.txt)

          VERSION=$(echo "$VERSION" | tr -d '\r\n')

          if [ -z "$VERSION" ]; then
            echo "获取 Mihomo Alpha 版本失败"
            exit 1
          fi

          echo "最新 Alpha: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Mihomo ARM64 Alpha
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/mihomo-linux-arm64-${VERSION}.gz"

          echo "下载：$URL"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o mihomo.gz

      - name: Extract Mihomo
        shell: bash
        run: |
          set -e

          gzip -t mihomo.gz
          gzip -dc mihomo.gz > mihomo-alpha-linux-arm64.upx

          chmod +x mihomo-alpha-linux-arm64.upx

          echo "文件信息："
          file mihomo-alpha-linux-arm64.upx

      - name: Compress with UPX
        shell: bash
        run: |
          set -e

          echo "UPX 压缩前："
          ls -lh mihomo-alpha-linux-arm64.upx

          upx --best --lzma mihomo-alpha-linux-arm64.upx

          echo "UPX 压缩后："
          ls -lh mihomo-alpha-linux-arm64.upx

      - name: Verify UPX
        shell: bash
        run: |
          set -e

          upx -t mihomo-alpha-linux-arm64.upx

          echo "最终文件信息："
          file mihomo-alpha-linux-arm64.upx

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          TAG="mihomo"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在"
          else
            echo "创建 Release $TAG"

            gh release create "$TAG" \
              --title "Mihomo Alpha" \
              --notes "自动更新 Mihomo Alpha ARM64 UPX"
          fi

      - name: Upload UPX asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          gh release upload \
            mihomo \
            mihomo-alpha-linux-arm64.upx \
            --clobber

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          cat > release-notes.md <<EOF
Mihomo Alpha ARM64 UPX

版本：$VERSION

架构：linux-arm64
压缩：UPX --best --lzma
EOF

          gh release edit mihomo \
            --title "Mihomo Alpha $VERSION" \
            --notes-file release-notes.md
```
